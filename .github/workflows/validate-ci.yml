name: Validate CI
on:
  workflow_dispatch:
jobs:
  it-python-validate:
    name: it-python [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Simulated per-runner flake (fail on attempt 1, pass on rerun)
        run: |
          echo "run_attempt=${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "simulated per-runner flake"; exit 1
          fi
          echo "passes on fresh-runner rerun"
  unit-validate:
    name: python_ut_tests [validate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "non-IT job — must never be re-run by the companion"
